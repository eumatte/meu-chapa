<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Chapa — Catálogo Drop 001</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Grotesk:wght@300;400;500;600;700&family=VT323&family=Black+Ops+One&display=swap" rel="stylesheet">
<style>
:root {
  --black:  #0D0D0D;
  --gray:   #141414;
  --mid:    #222;
  --border: #2a2a2a;
  --off:    #F2EDD7;
  --cream:  #E8DCC0;
  --lime:   #A8D240;
  --green:  #2D5A27;
  --yellow: #F0C419;
  --red:    #C1230A;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

body {
  background:var(--black); color:var(--off);
  font-family:'Space Grotesk',sans-serif;
  overflow-x:hidden;
}

/* grain */
body::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:9000; opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px;
}

/* ─ NAV ─ */
nav {
  position:sticky; top:0; z-index:100;
  display:flex; justify-content:space-between; align-items:center;
  padding:18px 48px;
  background:rgba(13,13,13,.97);
  border-bottom:1px solid var(--border);
}
.nav-logo { font-family:'Permanent Marker',cursive; font-size:22px; color:var(--off); text-decoration:none; }
.nav-logo em { color:var(--lime); font-style:normal; }
.nav-tag {
  font-family:'VT323',monospace; font-size:15px; letter-spacing:5px;
  color:var(--lime); text-transform:uppercase;
}
.nav-back {
  font-size:11px; font-weight:600; letter-spacing:3px; text-transform:uppercase;
  color:rgba(242,237,215,.4); text-decoration:none; transition:color .2s;
}
.nav-back:hover { color:var(--lime); }

/* ─ HERO CATALOG ─ */
.cat-hero {
  padding:80px 48px 64px;
  display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:center;
  border-bottom:1px solid var(--border);
}
.cat-hero-label {
  font-family:'VT323',monospace; font-size:15px; letter-spacing:6px;
  color:var(--lime); text-transform:uppercase; margin-bottom:16px;
}
.cat-hero-title {
  font-family:'Permanent Marker',cursive; font-size:clamp(56px,7vw,100px);
  line-height:.88; color:var(--off); margin-bottom:24px;
}
.cat-hero-title span { color:var(--lime); }
.cat-hero-desc {
  font-size:15px; line-height:1.9; color:rgba(242,237,215,.55);
  font-weight:300; max-width:420px; margin-bottom:40px;
}
.cat-hero-meta {
  display:flex; gap:48px;
}
.meta-item { }
.meta-num {
  font-family:'Black Ops One',cursive; font-size:42px;
  color:var(--lime); line-height:1;
}
.meta-label {
  font-family:'VT323',monospace; font-size:13px; letter-spacing:3px;
  color:rgba(242,237,215,.35); text-transform:uppercase; margin-top:4px;
}
.cat-hero-img {
  position:relative; border:1px solid var(--border);
  overflow:hidden;
}
.cat-hero-img img {
  width:100%; display:block;
  filter:contrast(1.05);
}
.cat-hero-img::after {
  content:'DROP 001';
  position:absolute; bottom:20px; right:20px;
  font-family:'Black Ops One',cursive; font-size:11px; letter-spacing:4px;
  color:var(--lime); opacity:.6;
}

/* ─ PRODUCTS ─ */
.products { padding:0; }

.product {
  display:grid; grid-template-columns:1fr 1fr;
  min-height:90vh;
  border-bottom:1px solid var(--border);
  position:relative;
  overflow:hidden;
}
.product:nth-child(even) { direction:rtl; }
.product:nth-child(even) > * { direction:ltr; }

/* image side */
.prod-visual {
  background:var(--gray);
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
  padding:64px;
}
.prod-visual-bg {
  position:absolute; inset:0;
  background-image:radial-gradient(circle,rgba(168,210,64,.06) 1px,transparent 1px);
  background-size:24px 24px;
}
.prod-img-wrap {
  position:relative; z-index:1;
  width:100%; max-width:360px;
  transition:transform .6s cubic-bezier(.16,1,.3,1);
}
.prod-img-wrap:hover { transform:scale(1.03) rotate(-1deg); }
.prod-img-wrap img { width:100%; display:block; filter:drop-shadow(0 32px 64px rgba(0,0,0,.6)); }

/* mockup placeholder (when using catalog crop) */
.prod-mockup {
  width:100%; max-width:340px; aspect-ratio:1;
  display:flex; align-items:center; justify-content:center;
  position:relative; z-index:1;
  font-family:'Permanent Marker',cursive;
}

/* info side */
.prod-info {
  padding:80px 64px;
  display:flex; flex-direction:column; justify-content:center;
  background:var(--black);
  position:relative;
}
.prod-info::before {
  content:'';
  position:absolute; top:0; right:0;
  width:1px; height:100%;
  background:linear-gradient(to bottom,transparent,var(--border),transparent);
}
.product:nth-child(even) .prod-info::before { right:auto; left:0; }

.prod-num {
  font-family:'VT323',monospace; font-size:80px; line-height:1;
  color:rgba(168,210,64,.08); position:absolute; top:40px; right:48px;
  pointer-events:none; user-select:none; font-weight:400;
}
.prod-category {
  font-family:'VT323',monospace; font-size:13px; letter-spacing:5px;
  color:var(--lime); text-transform:uppercase; margin-bottom:16px;
}
.prod-name {
  font-family:'Black Ops One',cursive; font-size:clamp(36px,4vw,60px);
  line-height:.92; letter-spacing:1px; color:var(--off); margin-bottom:24px;
}
.prod-divider {
  width:48px; height:2px; background:var(--lime); margin-bottom:28px;
}
.prod-desc {
  font-size:15px; line-height:1.85; color:rgba(242,237,215,.6);
  font-weight:300; max-width:400px; margin-bottom:40px;
}
.prod-specs {
  display:flex; flex-direction:column; gap:12px; margin-bottom:40px;
}
.spec-row {
  display:flex; justify-content:space-between; align-items:center;
  padding-bottom:12px; border-bottom:1px solid var(--border);
  font-size:13px;
}
.spec-key {
  font-family:'VT323',monospace; letter-spacing:3px; text-transform:uppercase;
  color:rgba(242,237,215,.35); font-size:13px;
}
.spec-val { font-weight:600; color:var(--off); letter-spacing:.5px; }
.prod-sizes {
  display:flex; gap:8px; margin-bottom:40px; flex-wrap:wrap;
}
.size-btn {
  width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  border:1.5px solid var(--border); color:rgba(242,237,215,.5);
  font-size:12px; font-weight:600; letter-spacing:1px;
  transition:all .2s; cursor:pointer;
}
.size-btn:hover, .size-btn.active {
  border-color:var(--lime); color:var(--lime);
  background:rgba(168,210,64,.08);
}
.prod-footer {
  display:flex; align-items:center; gap:20px;
}
.prod-price {
  font-family:'Black Ops One',cursive; font-size:36px;
  color:var(--off); letter-spacing:1px;
}
.prod-price-label {
  font-family:'VT323',monospace; font-size:13px; letter-spacing:3px;
  color:rgba(242,237,215,.3); text-transform:uppercase; margin-bottom:2px;
}
.btn-buy {
  flex:1; padding:16px 32px; background:var(--lime);
  color:var(--black); font-size:12px; font-weight:700; letter-spacing:3px;
  text-transform:uppercase; border:
